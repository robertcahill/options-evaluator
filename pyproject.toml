[project]
name = "options"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "openpyxl>=3.1.5",
    "scipy>=1.18.1",
]

# This folder lives on Google Drive (G:); uv's cache is on C:. Copy instead of
# hardlink so installs don't warn on every sync.
[tool.uv]
link-mode = "copy"
